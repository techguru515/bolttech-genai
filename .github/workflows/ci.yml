name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install -r requirements.txt

      - name: Train model (fast path)
        run: python -m claim_agent.train
        env:
          GENAI_MODE: mock

      - name: Run tests
        run: pytest -q
        env:
          GENAI_MODE: mock

      - name: Upload model artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: claim-model
          path: models/
